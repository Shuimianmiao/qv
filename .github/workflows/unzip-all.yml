on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-all:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 批量解压所有 ZIP 文件（去掉重复的顶层目录）
        run: |
          set -euo pipefail
          # 查找仓库所有 .zip 文件（包括子目录），并逐个处理
          find . -name "*.zip" -type f -print0 | while IFS= read -r -d '' zipfile; do
            # 获取文件名（不含路径和扩展名），例如 app/src.zip -> src
            filename=$(basename "$zipfile" .zip)
            # 获取文件所在目录
            dirpath=$(dirname "$zipfile")
            dest="$dirpath/$filename"
            echo "正在解压 $zipfile 到 $dest"
            mkdir -p "$dest"

            tmpdir=$(mktemp -d)
            unzip -q "$zipfile" -d "$tmpdir"

            # 如果临时目录为空则跳过
            if [ -z "$(ls -A "$tmpdir" 2>/dev/null || true)" ]; then
              echo "警告：$zipfile 解压后为空，跳过移动"
              rm -rf "$tmpdir"
              continue
            fi

            # 检查解压后的临时目录是否只有一个顶层目录（包括隐藏文件）
            shopt -s dotglob
            items=("$tmpdir"/*)
            shopt -u dotglob
            
            if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
              # 只有一个目录：把该目录下的内容（含隐藏文件）移动到目标目录
              shopt -s dotglob
              mv "${items[0]}"/* "$dest"/ 2>/dev/null || true
              shopt -u dotglob
            else
              # 多个文件/目录：直接把临时目录下所有内容移动到目标目录
              shopt -s dotglob
              mv "$tmpdir"/* "$dest"/ 2>/dev/null || true
              shopt -u dotglob
            fi

            # 清理临时目录
            rm -rf "$tmpdir"
          done

      - name: 查看解压后的文件结构（可选）
        run: |
          echo "根目录文件结构："
          find . -type f -name "*.zip" | head -20

      - name: 提交解压后的文件回仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "自动解压所有 ZIP 文件" || echo "没有变化需要提交"
          git push
